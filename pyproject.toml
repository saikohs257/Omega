[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "omega-kernel"
version = "0.1.0b1"
description = "Deterministic constitutional runtime kernel"
requires-python = ">=3.11"

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[tool.setuptools.packages.find]
include = [
  "atlas*",
  "bentaxis*",
  "colony*",
  "court*",
  "hypergraph*",
  "omega*",
  "oracle*",
  "runtime*",
  "sheaf*",
  "simplicial*",
  "tiamat*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
