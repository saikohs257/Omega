name: TIAMAT Relative Recovery Anti-Leakage Court V2

on:
  workflow_dispatch:

jobs:
  anti-leakage:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip pandas numpy scikit-learn
      - name: Download canonical Layer1 V2
        run: |
          set -euo pipefail
          mkdir -p data/canonical
          curl --fail --location --retry 5 --retry-all-errors --silent --show-error \
            'https://github.com/saikohs257/Omega/releases/download/LAYER1_CANONICAL_2020_2024_V1/LAYER1_CANONICAL_2020_2024_V2.zip' \
            --output data/canonical/canonical.zip
          unzip -o data/canonical/canonical.zip -d data/canonical
          CSV=$(find data/canonical -name 'layer1_structured_hazard_arm_timeseries*.csv' | head -1)
          test -n "$CSV"
          cp "$CSV" data/canonical/input.csv
      - name: Run anti-leakage court
        run: python experiments/hydra_relative_recovery_anti_leakage_court_v2.py data/canonical/input.csv --out hydra_relative_recovery_anti_leakage_court_v2.json
      - name: Validate contract
        run: |
          python - <<'PY'
          import json
          p=json.load(open('hydra_relative_recovery_anti_leakage_court_v2.json'))
          assert p['experiment']=='HYDRA_RELATIVE_RECOVERY_ANTI_LEAKAGE_COURT_V2'
          assert p['canonical_rows']==43848
          assert p['nonoverlap_72h']['real']['n']>0
          print('ANTI_LEAKAGE_COURT_V2_CONTRACT_PASS')
          print(json.dumps(p,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: hydra-relative-recovery-anti-leakage-court-v2
          path: hydra_relative_recovery_anti_leakage_court_v2.json
