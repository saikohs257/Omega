name: TIAMAT Recursive Memory Court V2

on:
  workflow_dispatch:

jobs:
  recursive-memory:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip pandas numpy
      - run: python -m py_compile experiments/tiamat_memory_chain_v2.py
      - name: Download canonical Layer1 V2
        run: |
          set -euo pipefail
          mkdir -p data/canonical
          curl --fail --location --retry 5 --retry-all-errors --silent --show-error \
            'https://github.com/saikohs257/Omega/releases/download/LAYER1_CANONICAL_2020_2024_V1/LAYER1_CANONICAL_2020_2024_V2.zip' \
            --output data/canonical/canonical.zip
          unzip -o data/canonical/canonical.zip -d data/canonical
          CSV=$(find data/canonical -name 'layer1_structured_hazard_arm_timeseries*.csv' | head -1)
          test -n "$CSV"
          cp "$CSV" data/canonical/input.csv
      - name: Run chained fading-memory experiments
        run: python experiments/tiamat_memory_chain_v2.py data/canonical/input.csv --out tiamat_memory_chain_v2.json
      - name: Validate chained contract
        run: |
          python - <<'PY'
          import json
          p=json.load(open('tiamat_memory_chain_v2.json'))
          assert p['experiment']=='TIAMAT_MEMORY_CHAIN_V2'
          assert p['guardrails']['holdout_not_used_for_selection'] is True
          assert len(p['chain'])==3
          e1,e2,e3=p['chain']
          assert e1['selected_family'] in ('exp','window','tri')
          assert e2['selected_family']==e1['selected_family']
          assert e3['frozen_family']==e2['selected_family']
          assert e3['frozen_scale']==e2['selected_scale']
          assert e3['result']['state_completed_pairs']>0
          print('TIAMAT_MEMORY_CHAIN_V2_CONTRACT_PASS')
          print('E1:',e1['selected_family'],e1['selected_scale'])
          print('E2:',e2['selected_family'],e2['selected_scale'])
          print('E3:',e3['result'])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: tiamat-memory-chain-v2
          path: tiamat_memory_chain_v2.json
