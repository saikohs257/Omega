name: TIAMAT Recursive Memory Court V1

on:
  workflow_dispatch:
  push:
    paths:
      - 'experiments/tiamat_recursive_memory_court_v1.py'
      - '.github/workflows/tiamat-recursive-memory-court-v1-manual.yml'

jobs:
  recursive-memory:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip pandas numpy
      - run: python -m py_compile experiments/tiamat_recursive_memory_court_v1.py
      - name: Download canonical Layer1 V2
        run: |
          set -euo pipefail
          mkdir -p data/canonical
          curl --fail --location --retry 5 --retry-all-errors --silent --show-error \
            'https://github.com/saikohs257/Omega/releases/download/LAYER1_CANONICAL_2020_2024_V1/LAYER1_CANONICAL_2020_2024_V2.zip' \
            --output data/canonical/canonical.zip
          unzip -o data/canonical/canonical.zip -d data/canonical
          CSV=$(find data/canonical -name 'layer1_structured_hazard_arm_timeseries*.csv' | head -1)
          test -n "$CSV"
          cp "$CSV" data/canonical/input.csv
      - name: Run recursive memory court
        run: python experiments/tiamat_recursive_memory_court_v1.py data/canonical/input.csv --out tiamat_recursive_memory_court_v1.json
      - name: Validate
        run: |
          python - <<'PY'
          import json, math
          p=json.load(open('tiamat_recursive_memory_court_v1.json'))
          assert p['experiment']=='TIAMAT_RECURSIVE_MEMORY_COURT_V1'
          assert p['caliper']==0.05
          assert p['minimum_temporal_separation_h']==168
          assert len(p['results'])==12
          assert all(r['pairs_base_match']>0 for r in p['results'])
          print('RECURSIVE_MEMORY_CONTRACT_PASS')
          for r in p['results']: print(r)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: tiamat-recursive-memory-court-v1
          path: tiamat_recursive_memory_court_v1.json
