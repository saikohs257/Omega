name: TIAMAT Path Memory Court V1

on:
  workflow_dispatch:

jobs:
  path-memory:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip pandas numpy
      - run: python -m py_compile experiments/tiamat_path_memory_chain_v1.py
      - name: Download canonical Layer1 V2
        run: |
          set -euo pipefail
          mkdir -p data/canonical
          curl --fail --location --retry 5 --retry-all-errors --silent --show-error \
            'https://github.com/saikohs257/Omega/releases/download/LAYER1_CANONICAL_2020_2024_V1/LAYER1_CANONICAL_2020_2024_V2.zip' \
            --output data/canonical/canonical.zip
          unzip -o data/canonical/canonical.zip -d data/canonical
          CSV=$(find data/canonical -name 'layer1_structured_hazard_arm_timeseries*.csv' | head -1)
          test -n "$CSV"
          cp "$CSV" data/canonical/input.csv
      - name: Run chained path-history experiments
        run: python experiments/tiamat_path_memory_chain_v1.py data/canonical/input.csv --out tiamat_path_memory_chain_v1.json
      - name: Validate chained contract
        run: |
          python - <<'PY'
          import json
          p=json.load(open('tiamat_path_memory_chain_v1.json'))
          assert p['experiment']=='TIAMAT_PATH_MEMORY_CHAIN_V1'
          assert p['locked_test']['year']==2024
          assert p['locked_test']['base_pairs']>0
          assert p['locked_test']['state_conditioned_pairs']>0
          print('TIAMAT_PATH_MEMORY_CHAIN_V1_CONTRACT_PASS')
          print('SELECTED:',p['selected_path_variable'])
          print('LOCKED:',p['locked_test'])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: tiamat-path-memory-chain-v1
          path: tiamat_path_memory_chain_v1.json
