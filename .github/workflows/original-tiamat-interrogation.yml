name: Original TIAMAT Interrogation

on:
  push:
    branches: [main]
    paths:
      - 'experiments/original_tiamat_interrogation.py'
      - 'tiamat/**'
      - '.github/workflows/original-tiamat-interrogation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  interrogate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Verify tested revision
        run: |
          echo "event=${GITHUB_EVENT_NAME}"
          echo "ref=${GITHUB_REF}"
          echo "sha=${GITHUB_SHA}"
          echo "checked_out=$(git rev-parse HEAD)"
          test "${GITHUB_SHA}" = "$(git rev-parse HEAD)"
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Omega
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[test]'
          python -m pip install 'numpy>=1.26,<3'
      - name: Run original TIAMAT interrogation
        run: |
          mkdir -p interrogation-results
          python experiments/original_tiamat_interrogation.py | tee interrogation-results/original-tiamat.txt
      - name: Upload interrogation result
        uses: actions/upload-artifact@v4
        with:
          name: original-tiamat-${{ matrix.python-version }}-${{ github.sha }}
          path: interrogation-results/original-tiamat.txt
          if-no-files-found: error
