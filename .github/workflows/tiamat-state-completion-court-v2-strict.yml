name: TIAMAT State Completion Court V2 Strict

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'experiments/tiamat_state_completion_court_v2_strict.py'
      - '.github/workflows/tiamat-state-completion-court-v2-strict.yml'
  push:
    paths:
      - 'experiments/tiamat_state_completion_court_v2_strict.py'
      - '.github/workflows/tiamat-state-completion-court-v2-strict.yml'

jobs:
  state-completion:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: python -m pip install --upgrade pip pandas numpy scipy scikit-learn

      - name: Verify checked-out revision
        run: |
          echo "GITHUB_SHA=$GITHUB_SHA"
          echo "HEAD=$(git rev-parse HEAD)"
          test "$GITHUB_SHA" = "$(git rev-parse HEAD)"

      - name: Compile
        run: python -m py_compile experiments/tiamat_state_completion_court_v2_strict.py

      - name: Download canonical Layer1 V2
        run: |
          set -euo pipefail
          mkdir -p data/canonical
          curl --fail --location --retry 5 --retry-all-errors --silent --show-error \
            'https://github.com/saikohs257/Omega/releases/download/LAYER1_CANONICAL_2020_2024_V1/LAYER1_CANONICAL_2020_2024_V2.zip' \
            --output data/canonical/canonical.zip
          unzip -o data/canonical/canonical.zip -d data/canonical
          CSV=$(find data/canonical -name 'layer1_structured_hazard_arm_timeseries*.csv' | head -1)
          test -n "$CSV"
          cp "$CSV" data/canonical/input.csv

      - name: Verify canonical spine
        run: |
          python - <<'PY'
          import hashlib
          from pathlib import Path
          import pandas as pd
          p=Path('data/canonical/input.csv')
          df=pd.read_csv(p)
          assert len(df)==43848, len(df)
          assert ((df['entry_path']=='3_to_4') & (df['episode_age_h']==1)).sum()==169
          sha=hashlib.sha256(p.read_bytes()).hexdigest()
          print({'rows':len(df),'h3_starts':int(((df['entry_path']=='3_to_4')&(df['episode_age_h']==1)).sum()),'sha256':sha})
          PY

      - name: Run strict state completion court
        run: python experiments/tiamat_state_completion_court_v2_strict.py data/canonical/input.csv --out tiamat_state_completion_court_v2_strict.json

      - name: Validate forensic contract
        run: |
          python - <<'PY'
          import json
          p=json.load(open('tiamat_state_completion_court_v2_strict.json'))
          assert p['experiment']=='TIAMAT_STATE_COMPLETION_COURT_V2_STRICT'
          assert p['controls']['holdout_scaling_used'] is False
          assert p['controls']['history_selection_on_holdout'] is False
          assert p['controls']['target_peek'] is False
          assert p['controls']['purge_hours']==6
          assert p['matching']['minimum_temporal_separation_h']==168
          print('STATE_COMPLETION_V2_FORENSIC_CONTRACT_PASS')
          print(json.dumps(p['nested_temporal_models']['holdout'], indent=2))
          for r in p['matching']['results']:
              print(r['state'], 'pairs=', r['pairs'], 'median_dist=', r['median_pair_distance'])
              for k,v in r['history'].items():
                  if v['pair_orientation_auc'] is not None:
                      print(' ',k,v)
          PY

      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: tiamat-state-completion-court-v2-strict
          path: tiamat_state_completion_court_v2_strict.json
