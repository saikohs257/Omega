name: TIAMAT Memory Discrimination (MANUAL)

on:
  workflow_dispatch:

jobs:
  memory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install --upgrade pip pandas numpy scikit-learn
      - name: Verify court
        run: python -m py_compile experiments/tiamat_memory_discrimination_v1.py
      - name: Download canonical Layer1 V2
        run: |
          set -euo pipefail
          mkdir -p data/canonical
          curl --fail --location --retry 5 --retry-all-errors --silent --show-error \
            "https://github.com/saikohs257/Omega/releases/download/LAYER1_CANONICAL_2020_2024_V1/LAYER1_CANONICAL_2020_2024_V2.zip" \
            --output data/canonical/canonical.zip
          unzip -o data/canonical/canonical.zip -d data/canonical
          CSV=$(find data/canonical -name 'layer1_structured_hazard_arm_timeseries*.csv' | head -1)
          test -n "$CSV"
          cp "$CSV" data/canonical/input.csv
      - name: Lock non-empty chronological folds
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('experiments/tiamat_memory_discrimination_v1.py')
          s=p.read_text()
          s=s.replace('DISCOVERY=(2020,2021,2022,2023); HOLDOUT=2024','DISCOVERY=(2021,2022,2023); HOLDOUT=2024')
          p.write_text(s)
          PY
          python -m py_compile experiments/tiamat_memory_discrimination_v1.py
      - name: Run memory discrimination court V3
        run: python experiments/tiamat_memory_discrimination_v1.py data/canonical/input.csv --out tiamat_memory_discrimination.json
      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: tiamat-memory-discrimination
          path: tiamat_memory_discrimination.json