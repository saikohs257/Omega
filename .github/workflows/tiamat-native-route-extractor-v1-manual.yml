name: TIAMAT Native Route Extractor V1 (MANUAL)

on:
  workflow_dispatch:

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install --upgrade pip pandas numpy
      - name: Verify extractor
        run: |
          set -euo pipefail
          test -f experiments/tiamat_native_route_extractor_v1.py
          python -m py_compile experiments/tiamat_native_route_extractor_v1.py
      - name: Download canonical Layer1 V2
        run: |
          set -euo pipefail
          mkdir -p data/canonical
          curl --fail --location --retry 5 --retry-all-errors --silent --show-error \
            "https://github.com/saikohs257/Omega/releases/download/LAYER1_CANONICAL_2020_2024_V1/LAYER1_CANONICAL_2020_2024_V2.zip" \
            --output data/canonical/canonical.zip
          unzip -o data/canonical/canonical.zip -d data/canonical
          CSV=$(find data/canonical -name 'layer1_structured_hazard_arm_timeseries*.csv' | head -1)
          test -n "$CSV"
          cp "$CSV" data/canonical/input.csv
      - name: Run HF9 native route extractor
        run: |
          python experiments/tiamat_native_route_extractor_v1.py data/canonical/input.csv \
            --out TIAMAT_NATIVE_ROUTE_RUNTIME_ALL_HEADS.csv \
            --cp15-out TIAMAT_NATIVE_ROUTE_CP15_ALL_HEADS.csv \
            --audit TIAMAT_NATIVE_ROUTE_AUDIT_REPORT.json
      - name: Upload HF9 outputs
        uses: actions/upload-artifact@v4
        with:
          name: tiamat-native-route-v1
          path: |
            TIAMAT_NATIVE_ROUTE_RUNTIME_ALL_HEADS.csv
            TIAMAT_NATIVE_ROUTE_CP15_ALL_HEADS.csv
            TIAMAT_NATIVE_ROUTE_AUDIT_REPORT.json
