name: TIAMAT State Completion Court V1

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/tiamat-state-completion-court-v1-manual.yml'
      - 'experiments/tiamat_state_completion_court_v1.py'

jobs:
  state-completion:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install --upgrade pip pandas numpy
      - name: Compile
        run: python -m py_compile experiments/tiamat_state_completion_court_v1.py
      - name: Download canonical Layer1 V2
        run: |
          set -euo pipefail
          mkdir -p data/canonical
          curl --fail --location --retry 5 --retry-all-errors --silent --show-error \
            'https://github.com/saikohs257/Omega/releases/download/LAYER1_CANONICAL_2020_2024_V1/LAYER1_CANONICAL_2020_2024_V2.zip' \
            --output data/canonical/canonical.zip
          unzip -o data/canonical/canonical.zip -d data/canonical
          CSV=$(find data/canonical -name 'layer1_structured_hazard_arm_timeseries*.csv' | head -1)
          test -n "$CSV"
          cp "$CSV" data/canonical/input.csv
      - name: Run state completion court
        run: python experiments/tiamat_state_completion_court_v1.py data/canonical/input.csv --out tiamat_state_completion_court_v1.json
      - name: Validate
        run: |
          python - <<'PY'
          import json, math
          p=json.load(open('tiamat_state_completion_court_v1.json'))
          assert p['experiment']=='TIAMAT_STATE_COMPLETION_COURT_V1'
          assert p['caliper']==0.05 and p['minimum_temporal_separation_h']==168
          assert len(p['results'])==1+len(p['candidate_state_coordinates'])
          vals=[r['result']['pairs'] for r in p['results']]
          assert max(vals)>0
          print('STATE_COMPLETION_CONTRACT_PASS')
          for r in p['results']:
              print(r['state_candidate'], r['result'])
          PY
      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: tiamat-state-completion-court-v1
          path: tiamat_state_completion_court_v1.json
