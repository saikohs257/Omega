name: ERK canonicalize

on:
  push:
    branches: [erk/canonicalization-v1]

permissions:
  contents: write

jobs:
  canonicalize:
    if: ${{ !contains(github.event.head_commit.message, '[erk-canonicalize]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Promote compatibility contracts
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          core = Path('erk/core.py')
          text = core.read_text()

          if 'def supervise(self, state: EpistemicState)' not in text:
              needle = '''        return (Action.BLOCK, Action.BRANCH, Action.ARCHIVE, Action.QUARANTINE, Action.REJECT, Action.ESCALATE, Action.ENABLE_EXECUTION)\n\n\n@dataclass(frozen=True, slots=True)\nclass Transition:'''
              replacement = '''        return (Action.BLOCK, Action.BRANCH, Action.ARCHIVE, Action.QUARANTINE, Action.REJECT, Action.ESCALATE, Action.ENABLE_EXECUTION)\n\n    def supervise(self, state: EpistemicState) -> Action:\n        state = state.normalized()\n        if state.cycles:\n            return Action.REJECT\n        if state.strain >= self.config.u_crit:\n            return Action.QUARANTINE\n        if state.calibration_error >= self.config.calibration_crit:\n            return Action.ESCALATE\n        if state.unsupported_depth >= self.config.depth_bound:\n            return Action.ESCALATE\n        if state.active_branches >= self.config.branch_bound:\n            return Action.BLOCK\n        if state.authority == Authority.EXECUTE:\n            return Action.ENABLE_EXECUTION\n        return Action.BLOCK\n\n\n@dataclass(frozen=True, slots=True)\nclass Transition:'''
              if needle not in text:
                  raise SystemExit('Supervisor insertion anchor not found')
              text = text.replace(needle, replacement, 1)

          if 'authority escalation requires kernel authorization' in text and 'if authorized_authority is not None and not evidence' not in text:
              needle = '''        if action == Action.ESCALATE:\n            if authorized_authority is None:\n                raise ValueError("authority escalation requires kernel authorization")'''
              replacement = '''        if authorized_authority is not None and not evidence and action is not Action.ESCALATE:\n            raise ValueError("authority escalation requires kernel authorization")\n        if action == Action.ESCALATE:\n            if authorized_authority is None:\n                raise ValueError("authority escalation requires kernel authorization")'''
              if needle not in text:
                  raise SystemExit('Transition authorization anchor not found')
              text = text.replace(needle, replacement, 1)

          core.write_text(text)

          kernel = Path('erk/kernel.py')
          text = kernel.read_text()
          text = text.replace('from dataclasses import dataclass, field', 'from dataclasses import dataclass, field, replace', 1)
          anchor = '''        if (\n            self.config.require_monotonic_evidence_count\n            and after.evidence_count < before.evidence_count\n        ):'''
          grant = '''        if authorized_grant is not None and action is not Action.ESCALATE:\n            after = replace(after, authority=authorized_grant).normalized()\n\n        if (\n            self.config.require_monotonic_evidence_count\n            and after.evidence_count < before.evidence_count\n        ):'''
          if 'after = replace(after, authority=authorized_grant)' not in text:
              if anchor not in text:
                  raise SystemExit('Kernel grant anchor not found')
              text = text.replace(anchor, grant, 1)
          kernel.write_text(text)
          PY
      - name: Quarantine compatibility module
        run: |
          git mv erk/compat.py erk/_compat_historical.py
          python - <<'PY'
          from pathlib import Path
          p = Path('erk/_compat_historical.py')
          s = p.read_text()
          s = s.replace('"""Small compatibility boundary for the current ERK contracts.', '"""Historical ERK compatibility boundary.\n\nDO NOT IMPORT: preserved as forensic reference after canonicalization.')
          p.write_text(s)
          PY
      - name: Commit canonical ERK
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add erk
          git commit -m "ERK canonicalize compatibility contracts [erk-canonicalize]"
          git push
      - name: Remove temporary workflow
        run: |
          git rm .github/workflows/erk-canonicalize.yml
          git commit -m "ERK remove temporary canonicalization workflow [erk-canonicalize]"
          git push
