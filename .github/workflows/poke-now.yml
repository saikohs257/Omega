name: Omega Poke Now
on:
  push:
    paths:
      - '.github/workflows/poke-now.yml'
      - 'experiments/first_poke/state_vs_damage_poke.py'
  workflow_dispatch:
jobs:
  poke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Verify tested revision
        run: |
          echo "sha=${GITHUB_SHA}"
          echo "checked_out=$(git rev-parse HEAD)"
          test "${GITHUB_SHA}" = "$(git rev-parse HEAD)"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Omega
        run: python -m pip install -e .
      - name: Run state versus damage poke
        run: python experiments/first_poke/state_vs_damage_poke.py
