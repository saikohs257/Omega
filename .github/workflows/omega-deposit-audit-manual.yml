name: Omega Deposit Audit (manual)

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref to audit'
        required: false
        default: 'main'
        type: string

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout and verify revision
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || 'main' }}
          fetch-depth: 1

      - name: Verify checkout identity
        shell: bash
        run: |
          set -euo pipefail
          echo "requested_ref=${{ inputs.ref || 'main' }}"
          echo "github_sha=${GITHUB_SHA}"
          echo "checked_out=$(git rev-parse HEAD)"
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"

      - name: Run full-system deposit audit
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ci-results
          python tools/omega_deposit_audit_v1.py . --out ci-results/omega_deposit_audit_v1.json

      - name: Upload audit
        uses: actions/upload-artifact@v4
        with:
          name: omega-deposit-audit
          path: ci-results/omega_deposit_audit_v1.json
          if-no-files-found: error
