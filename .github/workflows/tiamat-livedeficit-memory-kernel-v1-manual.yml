name: TIAMAT LiveDeficit Memory Kernel V1
on:
  workflow_dispatch:
jobs:
  court:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pandas numpy
      - name: Download canonical Layer1 V2
        run: |
          set -euo pipefail
          mkdir -p data/canonical
          curl --fail --location --retry 5 --retry-all-errors --silent --show-error \
            "https://github.com/saikohs257/Omega/releases/download/LAYER1_CANONICAL_2020_2024_V1/LAYER1_CANONICAL_2020_2024_V2.zip" \
            --output data/canonical/canonical.zip
          unzip -o data/canonical/canonical.zip -d data/canonical
          CSV=$(find data/canonical -name 'layer1_structured_hazard_arm_timeseries*.csv' | head -1)
          test -n "$CSV"
          cp "$CSV" data/canonical/input.csv
          test -s data/canonical/input.csv
      - name: Run LiveDeficit memory kernel court
        run: python experiments/tiamat_livedeficit_memory_kernel_v1.py data/canonical/input.csv --out livedeficit_memory_kernel_v1.json
      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: tiamat-livedeficit-memory-kernel-v1
          path: livedeficit_memory_kernel_v1.json
