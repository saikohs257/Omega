name: Hydra Crash72 Hazard-RR Interaction Court (MANUAL)

on:
  workflow_dispatch:

jobs:
  court:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install --upgrade pip pandas numpy scikit-learn
      - name: Verify court
        run: |
          set -euo pipefail
          test -f experiments/hydra_crash72_hazard_rr_interaction_court_v1.py
          grep -q 'hydra_crash72_hazard_rr_interaction_court_v1' experiments/hydra_crash72_hazard_rr_interaction_court_v1.py
          grep -q 'Hazard+RR+Interaction' experiments/hydra_crash72_hazard_rr_interaction_court_v1.py
          grep -q "'core':12,'transition':350,'orphan':606,'crash72':968" experiments/hydra_crash72_hazard_rr_interaction_court_v1.py
      - name: Download canonical artifact
        run: |
          set -euo pipefail
          mkdir -p data/canonical
          curl --fail --location --retry 5 --retry-all-errors --silent --show-error "https://github.com/saikohs257/Omega/releases/download/LAYER1_CANONICAL_2020_2024_V1/LAYER1_CANONICAL_2020_2024_V2.zip" --output data/canonical/canonical.zip
          unzip -o data/canonical/canonical.zip -d data/canonical
          CSV=$(find data/canonical -name 'layer1_structured_hazard_arm_timeseries*.csv' | head -1)
          test -n "$CSV"
          ln -sf "$(basename "$CSV")" data/canonical/layer1_structured_hazard_arm_timeseries.csv
      - name: Run interaction court
        run: python experiments/hydra_crash72_hazard_rr_interaction_court_v1.py data/canonical/layer1_structured_hazard_arm_timeseries.csv --out hazard_rr_interaction.json
      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: hydra-crash72-hazard-rr-interaction
          path: hazard_rr_interaction.json
