name: Hydra Crash72 Taxonomy Reconciliation (MANUAL)
on:
  workflow_dispatch:
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install --upgrade pip pandas numpy
      - name: Verify diagnostic
        run: |
          set -euo pipefail
          test -f experiments/hydra_crash72_taxonomy_reconciliation_v1.py
          python -m py_compile experiments/hydra_crash72_taxonomy_reconciliation_v1.py
      - name: Download canonical artifact
        run: |
          set -euo pipefail
          mkdir -p data/canonical
          curl --fail --location --retry 5 --retry-all-errors --silent --show-error "https://github.com/saikohs257/Omega/releases/download/LAYER1_CANONICAL_2020_2024_V1/LAYER1_CANONICAL_2020_2024_V2.zip" --output data/canonical/canonical.zip
          unzip -o data/canonical/canonical.zip -d data/canonical
          CSV=$(find data/canonical -name 'layer1_structured_hazard_arm_timeseries*.csv' | head -1)
          test -n "$CSV"
      - name: Run taxonomy reconciliation
        run: python experiments/hydra_crash72_taxonomy_reconciliation_v1.py "$CSV" --out taxonomy_reconciliation.json
        env:
          CSV: data/canonical/layer1_structured_hazard_arm_timeseries\(15\).csv
      - uses: actions/upload-artifact@v4
        with:
          name: hydra-crash72-taxonomy-reconciliation
          path: taxonomy_reconciliation.json
