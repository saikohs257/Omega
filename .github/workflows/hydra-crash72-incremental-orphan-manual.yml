name: Hydra Crash72 Incremental Orphan Court (MANUAL)

on:
  workflow_dispatch:

jobs:
  court:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install --upgrade pip pandas numpy scikit-learn
      - name: Verify court version and checkout
        run: |
          set -euo pipefail
          ACTUAL="$(git rev-parse HEAD)"
          echo "Checked out: $ACTUAL"
          grep -q 'hydra_crash72_incremental_orphan_court_v4' experiments/hydra_crash72_incremental_orphan_court_v1.py
          grep -q "counts=={'target_core':12,'target_transition':350,'target_orphan':606}" experiments/hydra_crash72_incremental_orphan_court_v1.py
          grep -q 'allow_nan=False' experiments/hydra_crash72_incremental_orphan_court_v1.py
      - name: Download canonical artifact
        run: |
          set -euo pipefail
          mkdir -p data/canonical
          curl --fail --location --retry 5 --retry-all-errors --silent --show-error "https://github.com/saikohs257/Omega/releases/download/LAYER1_CANONICAL_2020_2024_V1/LAYER1_CANONICAL_2020_2024_V2.zip" --output data/canonical/canonical.zip
          unzip -o data/canonical/canonical.zip -d data/canonical
          CSV=$(find data/canonical -name 'layer1_structured_hazard_arm_timeseries*.csv' | head -1)
          test -n "$CSV"
          ln -sf "$(basename "$CSV")" data/canonical/layer1_structured_hazard_arm_timeseries.csv
      - name: Run incremental court
        run: python experiments/hydra_crash72_incremental_orphan_court_v1.py data/canonical/layer1_structured_hazard_arm_timeseries.csv --out incremental_orphan.json
      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: hydra-crash72-incremental-orphan-v4
          path: incremental_orphan.json
