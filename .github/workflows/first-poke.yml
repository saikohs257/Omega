name: Omega First Poke

on:
  push:
    branches:
      - experiment/first-poke
  workflow_dispatch:

jobs:
  first-poke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run first poke
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python experiments/first_poke/run_first_poke.py
      - name: Upload first-poke result
        uses: actions/upload-artifact@v4
        with:
          name: omega-first-poke-result
          path: experiments/first_poke/first_poke_result.json
