name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: python -m pip wheel . --no-deps -w /tmp/omega-dist
      - run: python -m pip install /tmp/omega-dist/*.whl "pytest>=8,<9" "numpy>=1.26,<3" "pandas>=2,<3"
      - run: PYTHONPATH="$GITHUB_WORKSPACE" cd /tmp && PYTHONPATH="$GITHUB_WORKSPACE" python -m pytest "$GITHUB_WORKSPACE/tests" -q
