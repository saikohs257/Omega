name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: python -m pip wheel . --no-deps -w /tmp/omega-dist
      - run: python -m pip install /tmp/omega-dist/*.whl "pytest>=8,<9"
      - run: cd /tmp && python -m pytest "$GITHUB_WORKSPACE/tests" -q
      - name: Upload HF10 equivalence artifacts
        if: ${{ always() && hashFiles('equivalence_artifacts/**') != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: hf10-equivalence-${{ github.sha }}
          path: equivalence_artifacts/
          if-no-files-found: ignore
