name: test

on:
  push:
    branches:
      - main
      - fix/tiamat-state-machine
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Show tested revision
        run: git rev-parse HEAD && git rev-parse --verify HEAD^{commit}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: python -m pip wheel . --no-deps -w /tmp/omega-dist
      - run: python -m pip install -e ".[test]"
      - run: python -m compileall -q erk tiamat runtime bentaxis
      - run: python -m pytest tests -q

# CI trigger marker: no functional change.
