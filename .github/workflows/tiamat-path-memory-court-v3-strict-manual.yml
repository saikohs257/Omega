name: TIAMAT Path Memory Court V3 STRICT

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/tiamat-path-memory-court-v3-strict-manual.yml'
      - 'experiments/tiamat_path_memory_court_v3_strict.py'
      - 'experiments/tiamat_path_memory_court_v4_strict_timefix.py'
      - 'experiments/tiamat_path_memory_timestamp_diagnostic_v1.py'

jobs:
  strict-memory:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install --upgrade pip pandas numpy
      - name: Compile strict court
        run: |
          python -m py_compile experiments/tiamat_path_memory_court_v3_strict.py
          python -m py_compile experiments/tiamat_path_memory_court_v4_strict_timefix.py
          python -m py_compile experiments/tiamat_path_memory_timestamp_diagnostic_v1.py
      - name: Download canonical Layer1 V2
        run: |
          set -euo pipefail
          mkdir -p data/canonical
          curl --fail --location --retry 5 --retry-all-errors --silent --show-error \
            'https://github.com/saikohs257/Omega/releases/download/LAYER1_CANONICAL_2020_2024_V1/LAYER1_CANONICAL_2020_2024_V2.zip' \
            --output data/canonical/canonical.zip
          unzip -o data/canonical/canonical.zip -d data/canonical
          CSV=$(find data/canonical -name 'layer1_structured_hazard_arm_timeseries*.csv' | head -1)
          test -n "$CSV"
          cp "$CSV" data/canonical/input.csv
      - name: Run timestamp sanity diagnostic
        run: python experiments/tiamat_path_memory_timestamp_diagnostic_v1.py data/canonical/input.csv --out tiamat_path_memory_timestamp_diagnostic.json
      - name: Validate timestamp sanity
        run: |
          python - <<'PY'
          import json
          p=json.load(open('tiamat_path_memory_timestamp_diagnostic.json'))
          assert p['positive_rows'] > 0 and p['negative_rows'] > 0
          assert p['eligible_opposite_pairs_after_168h'] > 0
          print('TIMESTAMP_SANITY_PASS')
          print(json.dumps(p, indent=2))
          PY
      - name: Run strict matched-state court V4 time-safe
        run: python experiments/tiamat_path_memory_court_v4_strict_timefix.py data/canonical/input.csv --out tiamat_path_memory_court_v4_strict_timefix.json
      - name: Validate result contract
        run: |
          python - <<'PY'
          import json
          p=json.load(open('tiamat_path_memory_court_v4_strict_timefix.json'))
          assert p['experiment']=='TIAMAT_PATH_MEMORY_COURT_V4_STRICT_TIMEFIX'
          assert p['matching']['method']=='greedy_1to1_nearest_opposite_outcome'
          assert p['matching']['minimum_temporal_separation_h']==168
          assert p['matching']['same_regime_constraint'] is False
          assert 'datetime64[ns] timedelta' in p['matching']['timestamp_method']
          assert all(x not in p['present_features'] for x in ['entry_path','episode_type','duration_bucket','Crash72'])
          assert len(p['matching']['calipers']) == 7
          assert len(p['results']) == 7 * 15
          assert p['diagnostics']['eligible_opposite_pairs_after_168h'] > 0
          assert max(r['pairs'] for r in p['results']) > 0
          print('STRICT_COURT_CONTRACT_PASS')
          print(json.dumps(p['diagnostics'], indent=2))
          PY
      - name: Upload strict court result
        uses: actions/upload-artifact@v4
        with:
          name: tiamat-path-memory-court-v4-strict-timefix
          path: |
            tiamat_path_memory_court_v4_strict_timefix.json
            tiamat_path_memory_timestamp_diagnostic.json
