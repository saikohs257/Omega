name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Verify tested revision
        run: |
          echo "event=${GITHUB_EVENT_NAME}"
          echo "ref=${GITHUB_REF}"
          echo "sha=${GITHUB_SHA}"
          echo "checked_out=$(git rev-parse HEAD)"
          test "${GITHUB_SHA}" = "$(git rev-parse HEAD)"
          git status --short --branch
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[test]'
      - name: Verify scientific test dependencies
        run: python -c "import numpy; import pandas; import pytest; import sklearn; print(f'numpy={numpy.__version__}'); print(f'pandas={pandas.__version__}'); print(f'pytest={pytest.__version__}'); print(f'sklearn={sklearn.__version__}')"
      - name: Import package surface
        run: python -c "import atlas, bentaxis, colony, court, erk, hypergraph, hydra, omega, oracle, runtime, sheaf, simplicial, tiamat, end, pond"
      - name: Run TIAMAT tournament scorecard
        run: python -m tiamat.tournament_scorecard
      - name: Run TIAMAT tournament report
        run: python -m tiamat.tournament_report
      - name: Run TIAMAT Brier leaderboard
        run: python -m tiamat.tournament_brier_leaderboard
      - name: Run TIAMAT complete evidence audit
        run: python -m tiamat.tournament_full_audit
      - name: Run TIAMAT tournament round 2
        run: python -m tiamat.tournament_round2
      - name: Run TIAMAT tournament round 3
        run: python -m tiamat.tournament_round3
      - name: Run TIAMAT expanded world lab
        run: python -m tiamat.expanded_world_report
      - name: Run TIAMAT expanded selector scorecard
        run: python -m tiamat.expanded_selector_scorecard
      - name: Run TIAMAT adaptive mechanism discovery
        run: python -m tiamat.adaptive_mechanism_report
      - name: Run original TIAMAT state interrogation
        run: python experiments/original_tiamat_interrogation.py
      - name: Run TIAMAT metric discovery tests
        run: python -m pytest -q tests/test_tiamat_metric_discovery.py
      - name: Run TIAMAT controlled metric disagreement report
        run: python -m tiamat.metric_value_report
      - name: Run TIAMAT controlled metric disagreement tests
        run: python -m pytest -q tests/test_tiamat_metric_value_report.py
      - name: Run TIAMAT focused tests
        run: python -m pytest -q tests/test_tiamat_*.py
      - name: Fetch canonical Hydra dataset
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p data/canonical
          ASSET_ID="$(python - <<'PY'
          import json
          from pathlib import Path
          manifest = json.loads(Path("data/canonical/manifest.json").read_text())
          print(manifest["artifact"]["release_asset_id"])
          PY
          )"
          EXPECTED_ZIP_SHA="$(python - <<'PY'
          import json
          from pathlib import Path
          manifest = json.loads(Path("data/canonical/manifest.json").read_text())
          print(manifest["artifact"]["release_asset_sha256"])
          PY
          )"
          OUT="data/canonical/LAYER1_CANONICAL_2020_2024_V2.zip"
          API_URL="https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/assets/${ASSET_ID}"
          curl --fail --location --retry 5 --retry-all-errors --silent --show-error \
            -H "Accept: application/octet-stream" \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            "$API_URL" \
            --output "$OUT"
          ACTUAL_ZIP_SHA="$(sha256sum "$OUT" | awk '{print $1}')"
          test "$ACTUAL_ZIP_SHA" = "$EXPECTED_ZIP_SHA"
          unzip -o "$OUT" -d data/canonical
          CSV="data/canonical/layer1_structured_hazard_arm_timeseries(15).csv"
          test -f "$CSV"
          ln -sf "$(basename "$CSV")" data/canonical/layer1_structured_hazard_arm_timeseries.csv
          echo "release_asset_id=${ASSET_ID}"
          echo "release_asset_sha256=${ACTUAL_ZIP_SHA}"
      - name: Verify canonical Hydra court data
        run: |
          python - <<'PY'
          import hashlib
          import json
          import pathlib
          import pandas as pd

          manifest = json.loads(pathlib.Path("data/canonical/manifest.json").read_text())
          csv = pathlib.Path("data/canonical/layer1_structured_hazard_arm_timeseries.csv")
          expected_sha = manifest["integrity"]["sha256"]
          expected_rows = manifest["integrity"]["rows"]
          expected_cols = manifest["integrity"]["columns"]
          expected_h3 = manifest["integrity"]["native_3_to_4_starts"]

          digest = hashlib.sha256(csv.read_bytes()).hexdigest()
          assert digest == expected_sha, f"wrong canonical SHA: {digest}"
          df = pd.read_csv(csv)
          assert len(df) == expected_rows, len(df)
          assert len(df.columns) == expected_cols, len(df.columns)
          starts = ((df["entry_path"] == "3_to_4") & (df["episode_age_h"] == 1)).sum()
          assert int(starts) == expected_h3, starts

          print("CANONICAL SPINE")
          print(f"rows:       {len(df)}")
          print(f"columns:    {len(df.columns)}")
          print(f"H3 starts:  {int(starts)}")
          print(f"sha256:     {digest}")
          print("status:     VERIFIED")
          PY
      - name: Run Hydra head emergence court
        run: |
          mkdir -p ci-results
          python experiments/hydra_head_emergence_court_v1.py data/canonical/layer1_structured_hazard_arm_timeseries.csv --out ci-results/hydra_head_emergence_court_v1.json
      - name: Run Hydra conditional head ablation V1
        run: |
          mkdir -p ci-results
          python experiments/hydra_head_conditional_ablation_v1.py data/canonical/layer1_structured_hazard_arm_timeseries.csv --out ci-results/hydra_head_conditional_ablation_v1.json
      - name: Run Hydra conditional head ablation V2
        run: |
          mkdir -p ci-results
          python experiments/hydra_conditional_ablation_v2.py data/canonical/layer1_structured_hazard_arm_timeseries.csv --out ci-results/hydra_conditional_ablation_v2.json
      - name: Run Hydra AUC Brier incrementality court
        run: |
          mkdir -p ci-results
          python experiments/hydra_head_incrementality_court_v1.py data/canonical/layer1_structured_hazard_arm_timeseries.csv --out ci-results/hydra_head_incrementality_court_v1.json
      - name: Upload Hydra court results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hydra-head-courts-${{ matrix.python-version }}
          path: ci-results/
          if-no-files-found: ignore
      - name: Run full test suite
        run: python -m pytest -q
