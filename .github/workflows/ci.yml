name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Verify tested revision
        run: |
          echo "event=${GITHUB_EVENT_NAME}"
          echo "ref=${GITHUB_REF}"
          echo "sha=${GITHUB_SHA}"
          echo "checked_out=$(git rev-parse HEAD)"
          test "${GITHUB_SHA}" = "$(git rev-parse HEAD)"
          git status --short --branch
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[test]'
          python -m pip install 'numpy>=1.26,<3'
      - name: Verify scientific test dependencies
        run: python -c "import numpy; import pytest; print(f'numpy={numpy.__version__}'); print(f'pytest={pytest.__version__}')"
      - name: Import package surface
        run: python -c "import atlas, bentaxis, colony, court, erk, hypergraph, hydra, omega, oracle, runtime, sheaf, simplicial, tiamat, end, pond"
      - name: Run TIAMAT tournament scorecard
        run: python -m tiamat.tournament_scorecard
      - name: Run TIAMAT tournament report
        run: python -m tiamat.tournament_report
      - name: Run TIAMAT Brier leaderboard
        run: python -m tiamat.tournament_brier_leaderboard
      - name: Run TIAMAT complete evidence audit
        run: python -m tiamat.tournament_full_audit
      - name: Run TIAMAT tournament round 2
        run: python -m tiamat.tournament_round2
      - name: Run TIAMAT tournament round 3
        run: python -m tiamat.tournament_round3
      - name: Run TIAMAT expanded world lab
        run: python -m tiamat.expanded_world_report
      - name: Run TIAMAT expanded selector scorecard
        run: python -m tiamat.expanded_selector_scorecard
      - name: Run TIAMAT adaptive mechanism discovery
        run: python -m tiamat.adaptive_mechanism_report
      - name: Run original TIAMAT state interrogation
        run: python experiments/original_tiamat_interrogation.py
      - name: Run TIAMAT metric discovery tests
        run: python -m pytest -q tests/test_tiamat_metric_discovery.py
      - name: Run TIAMAT controlled metric disagreement report
        run: python -m tiamat.metric_value_report
      - name: Run TIAMAT controlled metric disagreement tests
        run: python -m pytest -q tests/test_tiamat_metric_value_report.py
      - name: Run TIAMAT focused tests
        run: python -m pytest -q tests/test_tiamat_*.py
      - name: Verify canonical Hydra court data
        run: |
          CSV="data/canonical/layer1_structured_hazard_arm_timeseries.csv"
          test -f "$CSV" || { echo "ERROR: canonical 2020-2024 Layer-1 CSV is missing: $CSV"; exit 1; }
          python - "$CSV" <<'PY'
          import hashlib, pathlib, sys
          import pandas as pd
          p = pathlib.Path(sys.argv[1])
          expected_sha = "6f0dc516fdf3313ab27a38d942504d073faccba4067877531b44c219c5e4b31a"
          digest = hashlib.sha256(p.read_bytes()).hexdigest()
          print(f"canonical_sha256={digest}")
          assert digest == expected_sha, f"wrong canonical SHA: {digest}"
          df = pd.read_csv(p)
          assert len(df) == 43848, len(df)
          starts = ((df["entry_path"] == "3_to_4") & (df["episode_age_h"] == 1)).sum()
          assert int(starts) == 169, starts
          print(f"canonical_rows={len(df)}")
          print(f"canonical_h3_starts={int(starts)}")
          PY
      - name: Run Hydra head emergence court
        run: |
          mkdir -p ci-results
          python experiments/hydra_head_emergence_court_v1.py \
            data/canonical/layer1_structured_hazard_arm_timeseries.csv \
            --out ci-results/hydra_head_emergence_court_v1.json
      - name: Run Hydra conditional head ablation court
        run: |
          mkdir -p ci-results
          python experiments/hydra_head_conditional_ablation_v1.py \
            data/canonical/layer1_structured_hazard_arm_timeseries.csv \
            --out ci-results/hydra_head_conditional_ablation_v1.json
      - name: Run Hydra sealed conditional ablation court V2
        run: |
          mkdir -p ci-results
          python experiments/hydra_conditional_ablation_v2.py \
            data/canonical/layer1_structured_hazard_arm_timeseries.csv \
            --out ci-results/hydra_conditional_ablation_v2.json
      - name: Upload Hydra court results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hydra-head-courts-${{ matrix.python-version }}
          path: ci-results/
          if-no-files-found: ignore
      - name: Run full test suite
        run: python -m pytest -q
