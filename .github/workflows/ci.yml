name: Directional CI

on:
  push:
    branches: [tmp/dvqt-directional-ci]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip && python -m pip install -e '.[test]' && python -m pip install 'numpy>=1.26,<3'
      - run: python -m tools.dvqt_transfer_lab
      - run: python -m tools.dvqt_relationship_lab
      - run: python -m pytest -q tests/test_dvqt_*.py
