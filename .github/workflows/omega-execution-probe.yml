name: Omega Execution Probe

on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/omega_execution_probe.py'
      - '.github/workflows/omega-execution-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Execute probe
        run: python tools/omega_execution_probe.py
