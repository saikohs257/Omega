name: TIAMAT Archaeology Court

on:
  workflow_dispatch:
  push:
    branches:
      - research/tiamat-archaeology-build

jobs:
  historical-court:
    name: Historical TIAMAT Court
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install "pytest>=8,<9" "numpy>=1.26,<3" "pandas>=2,<3" "scikit-learn>=1.5,<2"

      - name: Run recovered historical regression tests
        run: python -m pytest tests/test_tiamat_historical_hf8.py -q

      - name: Verify historical module imports
        run: |
          python - <<'PY'
          from tiamat.historical_hf8 import (
              recovered_active_mask,
              entry_path_at_start,
              build_age_chain,
              compute_hinge,
          )
          print("historical_hf8 import OK")
          print("entry 0.70 ->", entry_path_at_start(0.70, 0.0))
          print("entry 0.85 ->", entry_path_at_start(0.85, 0.0))
          print("entry 0.90 + shock 0.51 ->", entry_path_at_start(0.90, 0.51))
          PY

      - name: Run existing full suite
        run: python -m pytest tests -q
