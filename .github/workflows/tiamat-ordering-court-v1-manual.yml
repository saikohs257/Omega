name: TIAMAT Ordering Court V1

on:
  workflow_dispatch:
  push:
    paths:
      - 'experiments/tiamat_ordering_court_v1.py'
      - '.github/workflows/tiamat-ordering-court-v1-manual.yml'

jobs:
  ordering:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip pandas numpy
      - run: python -m py_compile experiments/tiamat_ordering_court_v1.py
      - name: Download canonical Layer1 V2
        run: |
          set -euo pipefail
          mkdir -p data/canonical
          curl --fail --location --retry 5 --retry-all-errors --silent --show-error \
            'https://github.com/saikohs257/Omega/releases/download/LAYER1_CANONICAL_2020_2024_V1/LAYER1_CANONICAL_2020_2024_V2.zip' \
            --output data/canonical/canonical.zip
          unzip -o data/canonical/canonical.zip -d data/canonical
          CSV=$(find data/canonical -name 'layer1_structured_hazard_arm_timeseries*.csv' | head -1)
          test -n "$CSV"
          cp "$CSV" data/canonical/input.csv
      - name: Run ordering court
        run: python experiments/tiamat_ordering_court_v1.py data/canonical/input.csv --out tiamat_ordering_court_v1.json
      - name: Validate
        run: |
          python - <<'PY'
          import json
          p=json.load(open('tiamat_ordering_court_v1.json'))
          assert p['experiment']=='TIAMAT_ORDERING_COURT_V1'
          assert p['match_features'][-1]=='ld_area24'
          assert p['caliper']==0.05
          assert p['minimum_temporal_separation_h']==168
          assert p['pairs']>0
          assert len(p['tests'])==6
          print('ORDERING_COURT_CONTRACT_PASS')
          print(json.dumps(p, indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: tiamat-ordering-court-v1
          path: tiamat_ordering_court_v1.json
