name: TIAMAT Head Court

on:
  push:
    branches: [research/tiamat-archaeology-build]
    paths:
      - 'experiments/first_poke/head_scope_court.py'
      - 'experiments/tiamat_head_ablation_battery.py'
      - 'tiamat/**'
      - 'tests/test_tiamat_head_scope_contract.py'
      - 'tests/test_tiamat_head_ablation_battery.py'
      - 'docs/TIAMAT_HEAD_ABLATION_BATTERY_V1.md'
  workflow_dispatch:

jobs:
  head-court:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Omega
        run: |
          python -m pip install -e .
          python -m pip install "pytest>=8,<9" "numpy>=1.26,<3" "pandas>=2,<3" "scikit-learn>=1.5,<2"
      - name: Run scoped head court
        run: python experiments/first_poke/head_scope_court.py
      - name: Run head scope contract
        run: pytest -q tests/test_tiamat_head_scope_contract.py
      - name: Run head ablation harness contract
        run: pytest -q tests/test_tiamat_head_ablation_battery.py
      - name: Verify battery result record exists
        run: test -f docs/TIAMAT_HEAD_ABLATION_BATTERY_V1.md
